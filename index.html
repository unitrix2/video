<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extension Assisted WASM Player</title>
    <script src="coi-serviceworker.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dplayer/dist/DPlayer.min.css">
    <style>
        body { background: linear-gradient(135deg, #020617 0%, #0b1329 100%); }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-4xl bg-slate-900/95 border border-slate-800 rounded-2xl shadow-2xl p-6 space-y-6">
        
        <div class="text-center space-y-1">
            <h1 class="text-2xl font-bold bg-gradient-to-r from-cyan-400 to-indigo-400 bg-clip-text text-transparent">
                यूनिवर्सल डिकोडर (Extension Mode)
            </h1>
            <p class="text-xs text-slate-400">CORS Extension ke sath 100% direct streaming</p>
        </div>

        <div class="flex flex-col md:flex-row gap-3">
            <input 
                type="text" 
                id="videoUrl" 
                placeholder="Apna direct Cloudflare / Workers link yahan paste karein..." 
                class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500 text-slate-200"
            />
            <button 
                onclick="playWithExtension()" 
                class="bg-cyan-600 hover:bg-cyan-500 text-white font-semibold px-6 py-3 rounded-xl transition text-sm whitespace-nowrap active:scale-95"
            >
                Direct Play
            </button>
        </div>

        <div id="dashboard" class="hidden bg-slate-950 border border-slate-800 rounded-xl p-4 space-y-4 font-mono text-xs">
            <div class="flex justify-between border-b border-slate-900 pb-2">
                <span class="text-slate-400">Engine Status:</span>
                <span id="engineStatus" class="text-yellow-400 font-bold">Ready...</span>
            </div>

            <div class="space-y-1">
                <div class="flex justify-between text-[11px]">
                    <span class="text-cyan-400">➔ Direct Download Progress:</span>
                    <span id="downloadText" class="text-slate-300">0 MB</span>
                </div>
                <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                    <div id="downloadBar" class="bg-cyan-500 h-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>

            <div class="space-y-1">
                <div class="flex justify-between text-[11px]">
                    <span class="text-indigo-400">➔ FFmpeg Wasm Decoding:</span>
                    <span id="transcodeText" class="text-slate-300">0%</span>
                </div>
                <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                    <div id="transcodeBar" class="bg-indigo-500 h-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>

            <div class="bg-black/40 border border-slate-900 rounded p-2 h-24 overflow-y-auto text-[10px] text-emerald-400" id="consoleLogs">
                > Waiting for link...
            </div>
        </div>

        <div class="overflow-hidden rounded-xl border border-slate-800 bg-black aspect-video">
            <div id="dplayer" class="w-full h-full"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dplayer/dist/DPlayer.min.js"></script>

    <script>
        const { createFFmpeg } = FFmpeg;
        let ffmpeg = null;
        let dp = null;

        dp = new DPlayer({ container: document.getElementById('dplayer'), video: { url: '' }, theme: '#06b6d4' });

        function printLog(text) {
            const box = document.getElementById('consoleLogs');
            box.innerHTML += `<div>> ${text}</div>`;
            box.scrollTop = box.scrollHeight;
        }

        async function playWithExtension() {
            if (typeof SharedArrayBuffer === "undefined") {
                alert("Security lock lagna baaki hai. Kripya page par 'Ctrl + F5' dabayein.");
                return;
            }

            const videoUrl = document.getElementById('videoUrl').value.trim();
            if (!videoUrl) return alert("Link paste karein!");

            document.getElementById('dashboard').classList.remove('hidden');
            document.getElementById('downloadBar').style.width = '0%';
            document.getElementById('transcodeBar').style.width = '0%';
            document.getElementById('downloadText').innerText = '0 MB';
            document.getElementById('transcodeText').innerText = '0%';
            document.getElementById('consoleLogs').innerHTML = '';

            document.getElementById('engineStatus').innerText = "⚡ Fetching Video via Extension...";
            printLog("CORS Extension ke zariye direct network request bheji gayi...");

            try {
                // Ab hum bina kisi proxy ke, seedhe aapke link ko fetch kar rahe hain
                const response = await fetch(videoUrl);
                if (!response.ok) throw new Error("Server responded with error status: " + response.status);

                const reader = response.body.getReader();
                let chunks = [];
                let receivedLength = 0;
                let targetSize = 25 * 1024 * 1024; // 25MB Buffer

                while(true) {
                    const {done, value} = await reader.read();
                    if (done) break;
                    chunks.push(value);
                    receivedLength += value.length;
                    
                    let currentMB = (receivedLength / (1024 * 1024)).toFixed(2);
                    let pct = Math.min((receivedLength / targetSize) * 100, 100).toFixed(0);
                    document.getElementById('downloadText').innerText = `${currentMB} MB`;
                    document.getElementById('downloadBar').style.width = `${pct}%`;

                    if (receivedLength >= targetSize) break;
                }
                reader.cancel();

                printLog(`Success! ${ (receivedLength/(1024*1024)).toFixed(2) } MB direct data downloaded successfully.`);

                // FFmpeg Loading
                document.getElementById('engineStatus').innerText = "⚙️ Decoding RAM Stream...";
                if (!ffmpeg) {
                    ffmpeg = createFFmpeg({ log: false });
                    ffmpeg.setLogger(({ message }) => {
                        if (message.includes('frame=')) {
                            document.getElementById('transcodeText').innerText = "Processing frames...";
                            document.getElementById('transcodeBar').style.width = '75%';
                        }
                    });
                    await ffmpeg.load();
                }

                let fileBuffer = new Uint8Array(receivedLength);
                let pos = 0;
                for(let chunk of chunks) {
                    fileBuffer.set(chunk, pos);
                    pos += chunk.length;
                }

                ffmpeg.FS('writeFile', 'input.mkv', fileBuffer);
                document.getElementById('transcodeBar').style.width = '30%';

                // Transcoding to playable MP4
                await ffmpeg.run(
                    '-i', 'input.mkv',
                    '-c:v', 'libx264',
                    '-preset', 'ultrafast',
                    '-tune', 'zerolatency',
                    '-movflags', '+faststart',
                    '-c:a', 'aac',
                    'out.mp4'
                );

                document.getElementById('transcodeBar').style.width = '100%';
                document.getElementById('transcodeText').innerText = '100%';
                document.getElementById('engineStatus').innerText = "▶️ Playing Video";

                const outputData = ffmpeg.FS('readFile', 'out.mp4');
                const blob = new Blob([outputData.buffer], { type: 'video/mp4' });
                const blobUrl = URL.createObjectURL(blob);

                if (dp) dp.destroy();
                dp = new DPlayer({
                    container: document.getElementById('dplayer'),
                    autoplay: true,
                    screenshot: true,
                    hotkey: true,
                    video: { url: blobUrl, type: 'normal' }
                });
                dp.play();
                printLog("Video started playing smoothly!");

            } catch (err) {
                console.error(err);
                document.getElementById('engineStatus').innerText = "❌ Error Occurred";
                printLog(`Error Details: ${err.message}`);
            }
        }
    </script>
</body>
</html>
